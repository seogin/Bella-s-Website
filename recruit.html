  <main class="application-page" onclick="change_background(event)">
    <section class="application-intro">
      <p class="application-kicker">CAREERS AT BELIZ</p>
      <h1>Come work with us.</h1>
      <p>
        We are always happy to meet thoughtful, creative people who care about great hair and a welcoming client
        experience. Tell us a little about yourself and attach your résumé.
      </p>
    </section>

    <!-- Replace YOUR_BASIN_FORM_ID with the ID from your Basin form endpoint. -->
    <form id="application-form" class="application-form ignore-background-change"
      action="https://usebasin.com/f/f292e6b2c0a1"
      method="POST"
      enctype="multipart/form-data"
      accept-charset="UTF-8"
      data-basin-form
      data-basin-success-action="render"
      data-basin-success-id="basin-success"
      data-basin-error-id="basin-error"
      data-basin-spam-protection="none">
      <input type="hidden" name="_subject" value="New Beliz job application">

      <div class="application-grid">
        <label>
          <span>First name</span>
          <input type="text" name="first_name" autocomplete="given-name" maxlength="60" required>
        </label>

        <label>
          <span>Last name</span>
          <input type="text" name="last_name" autocomplete="family-name" maxlength="60" required>
        </label>

        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" maxlength="120" required>
        </label>

        <label>
          <span>Phone</span>
          <input type="tel" name="phone" autocomplete="tel" maxlength="30" required>
        </label>

        <label>
          <span>Position</span>
          <input type="text" name="position" value="Hair Stylist" readonly>
          <!-- <select name="position" required> -->
            <!-- <option value="" selected disabled>Select a position</option> -->
            <!-- <option>Hair stylist</option> -->
            <!-- <option>Hair assistant</option> -->
            <!-- <option>Reception / guest services</option> -->
            <!-- <option>Other</option> -->
          <!-- </select> -->
        </label>

        <label>
          <span>Available start date</span>
          <input type="date" name="available_date" required>
        </label>
      </div>

      <label class="application-wide">
        <span>Brief introduction</span>
        <textarea name="message" rows="5" maxlength="1200"
          placeholder="Tell us about your experience, interests, and why you would like to join Beliz." required></textarea>
        <small>Maximum 1,200 characters.</small>
      </label>

      <label class="application-upload">
        <span>Résumé</span>
        <input id="resume" type="file" name="resume"
          accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          required>
        <small>PDF, DOC, or DOCX. Maximum 10 MB.</small>
      </label>

      <label class="application-consent">
        <input type="checkbox" name="privacy_consent" value="I consent" required>
        <span>I consent to Beliz using my information to review and respond to this application.</span>
      </label>

      <div class="application-actions">
        <button id="submit-button" type="submit">SUBMIT APPLICATION</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </div>
      <div id="basin-success" style="display: none;" aria-hidden="true"></div>
      <div id="basin-error" style="display: none;" aria-hidden="true"></div>
    </form>
  </main>
